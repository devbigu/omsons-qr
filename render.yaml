services:
  - type: pserv
    name: omsons-qr-mysql
    runtime: image
    plan: starter
    region: singapore
    image:
      url: docker.io/mysql:8.0
    disk:
      name: omsons-qr-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: omqr
      - key: MYSQL_USER
        value: omqr_user
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: omsons-qr
    runtime: docker
    plan: starter
    region: singapore
    envVars:
      - key: OMQR_DB_HOST
        fromService:
          type: pserv
          name: omsons-qr-mysql
          property: host
      - key: OMQR_DB_PORT
        value: "3306"
      - key: OMQR_DB_NAME
        value: omqr
      - key: OMQR_DB_USER
        value: omqr_user
      - key: OMQR_DB_PASS
        fromService:
          type: pserv
          name: omsons-qr-mysql
          envVarKey: MYSQL_PASSWORD
      - key: OMQR_DB_AUTO_CREATE
        value: "false"
      - key: OMQR_SESSION_DRIVER
        value: database
      - key: OMQR_ASSET_BASE
        value: "/assets"
      - key: OMQR_APP_ENTRY
        value: "/"
